[project]
name = "ai-cv-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "asadabbasse2006",email = "asadse2006@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pymupdf (>=1.28.2,<2.0.0)"
]

[tool.poetry]
packages = [{include = "ai_cv_assistant", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
